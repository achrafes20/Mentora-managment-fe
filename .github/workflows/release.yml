name: Release Frontend Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    name: Build et scan de l'image frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Construite et chargée localement dans le runner ; le push vers GHCR se fait
          # plus bas, une fois le scan Trivy passé (étape "Tag et push de l'image vers GHCR").
          push: false
          load: true
          tags: mentora-frontend:${{ github.sha }}, mentora-frontend:latest

      - name: Scan de vulnérabilités de l'image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mentora-frontend:${{ github.sha }}'
          format: 'table'
          output: 'trivy-image.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag et push de l'image vers GHCR
        id: push
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag mentora-frontend:${{ github.sha }} ghcr.io/mentora-ma/mentora-management-fe:latest
          docker tag mentora-frontend:${{ github.sha }} ghcr.io/mentora-ma/mentora-management-fe:sha-${SHORT_SHA}
          docker push ghcr.io/mentora-ma/mentora-management-fe:latest
          docker push ghcr.io/mentora-ma/mentora-management-fe:sha-${SHORT_SHA}

      - name: Publication du résultat dans le récapitulatif du run
        if: always()
        run: |
          {
            echo "## Scan de vulnérabilités — image frontend"
            echo
            if [ "${{ steps.push.outcome }}" = "success" ]; then
              echo "Image : \`ghcr.io/mentora-ma/mentora-management-fe:${{ github.sha }}\` (scannée et publiée sur GHCR)."
            else
              echo "Image : \`mentora-frontend:${{ github.sha }}\` (scannée localement — **non publiée**, le scan ou la publication a échoué ou a été sautée)."
            fi
            echo
            echo "Politique : \`CRITICAL,HIGH\`, \`ignore-unfixed: true\`, types \`os,library\`."
            echo
            if [ -s trivy-image.txt ]; then
              echo '```'
              cat trivy-image.txt
              echo '```'
            else
              echo "Aucune vulnérabilité CRITICAL/HIGH corrigeable détectée."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitOps – mise à jour tag frontend
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Clone Mentora_infra
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/mentora-ma/Mentora_infra.git

      - name: Mise à jour du tag frontend
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          FILE="Mentora_infra/mentora-management/kustomization.yml"

          echo "Tag déployé : $TAG"
          echo "--- Avant ---"
          cat "$FILE"

          sed -i "/name:.*mentora-management-fe/{n;s|newTag:[[:space:]]*[^#]*\(#.*\)|newTag: $TAG \1|;}" "$FILE"

          echo "--- Après ---"
          cat "$FILE"

      - name: Commit & Push vers Mentora_infra
        run: |
          cd Mentora_infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mentora-management/kustomization.yml
          git diff --cached --quiet && echo "Aucun changement à commiter" && exit 0
          git commit -m "chore(mentora-management): promote frontend to $TAG [skip ci]"
          git pull --rebase origin main
          git push origin main
